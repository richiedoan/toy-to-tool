<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner notes</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head><body><main>
<p class="eyebrow">PERSONAL WORKSPACE</p><h1>Owner notes</h1><p>Your private working notes, in one place.</p>
<form id="login"><label for="username">Username</label><input id="username" required autocomplete="username"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button>Sign in</button></form>
<section id="workspace" hidden><div class="row"><h2>Your notes</h2><button id="logout">Sign out</button></div><ul id="notes"></ul></section>
<p id="status" role="status" aria-live="polite">Sign in to continue.</p>
</main><script src="app.js"></script></body></html>
